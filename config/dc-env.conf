# dc-kos-setup configuration
# Copied to ~/.config/dc-kos-setup/dc-env.conf on first run; edit that copy.
# Every script sources the user copy, so changes take effect on the next step.

# --- Folder locations -------------------------------------------------------
# Root for toolchain, KOS, kos-ports and host tools (community default).
# Must live on the Linux filesystem, NOT under /mnt/c (10x+ slower builds).
DC_ROOT="/opt/toolchains/dc"
# Where your own Dreamcast projects go.
DC_PROJECTS="$HOME/dc-projects"

# Derived paths (normally leave alone)
KOS_DIR="$DC_ROOT/kos"
KOS_PORTS_DIR="$DC_ROOT/kos-ports"
SH_TOOLCHAIN="$DC_ROOT/sh-elf"
DC_TOOLS_BIN="$DC_ROOT/bin"
DC_SRC="$DC_ROOT/src"          # dcload-ip, mkdcdisc sources

# --- Versions ---------------------------------------------------------------
KOS_REPO="https://github.com/KallistiOS/KallistiOS.git"
KOS_BRANCH="master"
KOS_PORTS_REPO="https://github.com/KallistiOS/kos-ports.git"
KOS_PORTS_BRANCH="master"

# kos-chain profile (see utils/kos-chain/Makefile.dreamcast.cfg in KOS).
# sh4zam is tuned for SH-GCC 16.x, so we default to the newest 16 release.
# If it fails to build, 04-toolchain.sh retries once with FALLBACK_PROFILE.
TOOLCHAIN_PROFILE="16.2.0"
FALLBACK_PROFILE="stable"

# Parallel jobs for the toolchain build. "auto" = min(CPU threads, RAM_GB/2),
# which avoids OOM kills under WSL2's default memory cap.
MAKEJOBS="auto"

# Build the optional ARM (AICA sound CPU) toolchain? Only needed for custom
# sound drivers; KOS ships a prebuilt one.
BUILD_ARM_TOOLCHAIN=0

# --- KOS / ports options ----------------------------------------------------
# FP ABI. KOS default is -m4-single. Changing it means rebuilding EVERYTHING.
SH4_PRECISION="-m4-single"
# 0 = build only sh4zam (+ its deps); 1 = run kos-ports utils/build-all.sh
BUILD_ALL_PORTS=0
# Add "source environ.sh" to ~/.bashrc (1) or leave shell startup alone (0)
AUTO_SOURCE_ENVIRON=1

# --- Debug link / loaders ---------------------------------------------------
# Leave empty to keep KOS default loader ("dc-tool -x").
# Example: DC_LOADER="dc-tool-ip -t 192.168.1.100 -x"
DC_LOADER=""
BUILD_DCLOAD_IP=1
BUILD_MKDCDISC=1

# Windows-side Flycast executable (for run-flycast.sh). Optional.
FLYCAST_EXE="/mnt/c/Tools/flycast/flycast.exe"
